name: Comment on PR
description: Post a comment to a PR (expects to be run from a PR-triggered workflow)

inputs:
  input-file:
    description: Path to a file containing comment contents
    required: true

runs:
  using: "composite"
  steps:
    - name: Comment on PR
      uses: actions/github-script@v9
      env:
        INPUT_FILE: "${{ inputs.input-file }}"
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync(process.env.INPUT_FILE, 'utf8');

          github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body,
          })
