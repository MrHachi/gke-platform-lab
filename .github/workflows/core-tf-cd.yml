name: Core TF CD

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/core-tf-*
      - infrastructure/*/core/**

env:
  tofu-version: 1.12.0

jobs:
  save-platform-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure/stacks/core/platform
    env:
      PLAN_FILENAME: "${{ github.sha }}.tfplan"
      PLAN_BUCKET: ${{ vars.TFSTATE_BUCKET }}
      ARTIFACT_PREFIX: "${{ vars.ARTIFACT_PREFIX }}"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.tofu-version }}

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: "${{ vars.GCLOUD_PROJECT }}"
          workload_identity_provider: "${{ vars.GCLOUD_PROVIDER }}"
          service_account: "${{ vars.PLAN_SA }}"

      - name: Initialize stack online
        run: tofu init

      - name: Create plan file
        run: tofu plan -out="${PLAN_FILENAME}"

      - name: Upload plan
        run: gcloud storage cp "${PLAN_FILENAME}" "gs://${PLAN_BUCKET}/${ARTIFACT_PREFIX}cd/platform/${PLAN_FILENAME}"
