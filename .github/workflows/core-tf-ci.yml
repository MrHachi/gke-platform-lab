name: Core TF CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - edited
      - synchronize
    paths:
      - .github/workflows/core-tf-*
      - infrastructure/*/core/**

concurrency:
  group: core-tf-ci/${{ github.head_ref }}
  cancel-in-progress: true

env:
  tofu-version: 1.12.0

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack:
          - infrastructure/stacks/core/network
          - infrastructure/stacks/core/platform
      fail-fast: false
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.tofu-version }}

      - name: Initialize stack offline
        run: tofu init -backend=false

      - name: Validate
        run: tofu validate

  fmt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory:
          - infrastructure/stacks/core
          - infrastructure/modules/core
      fail-fast: false
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.tofu-version }}

      - name: Format check
        run: tofu fmt -recursive -check -diff

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory:
          - infrastructure/stacks/core
          - infrastructure/modules/core
      fail-fast: false
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Use latest version of tflint
      - name: Set up tflint
        uses: terraform-linters/setup-tflint@v6

      - name: Lint
        run: |
          tflint --init
          tflint -f compact

  plan-network:
    runs-on: ubuntu-latest
    needs:
      - validate
      - fmt
      - lint
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: infrastructure/stacks/core/network
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.tofu-version }}

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: "${{ vars.GCLOUD_PROJECT }}"
          workload_identity_provider: "${{ vars.GCLOUD_PROVIDER }}"
          service_account: "${{ vars.PLAN_SA }}"

      - name: Initialize stack online
        run: tofu init

      - name: Run tofu plan and detect changes
        run: |
          echo '# network stack plan' > comment.md
          echo '```text' >> comment.md
          set +e
          tofu plan -no-color -detailed-exitcode -lock=false -out=tfplan >> comment.md
          status=$?
          set -e
          echo '```' >> comment.md

          if [ $status -eq 1 ]; then
            exit 1
          fi

          if [ $status -eq 2 ]; then
            echo "# WARNING" >> comment.md
            echo "Changes detected for network stack." >> comment.md
            echo "Be sure to deploy network stack manually before merging." >> comment.md
          fi

      - name: Post plan to PR
        continue-on-error: true
        uses: .github/actions/comment-on-pr
        with:
          input-file: infrastructure/stacks/core/network/comment.md

      - name: Convert plan to JSON
        run: tofu show -json -plan=tfplan > tfplan.json

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          file: infrastructure/stacks/core/network/tfplan.json
          config_file: infrastructure/stacks/core/network/.checkov.yml
          output_format: github_failed_only

      - name: Post scan results to PR
        continue-on-error: true
        uses: .github/actions/comment-on-pr
        with:
          input-file: infrastructure/stacks/core/network/checkov.md

  plan-platform:
    runs-on: ubuntu-latest
    needs:
      - plan-network
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: infrastructure/stacks/core/platform
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.tofu-version }}

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: "${{ vars.GCLOUD_PROJECT }}"
          workload_identity_provider: "${{ vars.GCLOUD_PROVIDER }}"
          service_account: "${{ vars.PLAN_SA }}"

      - name: Initialize stack online
        run: tofu init

      - name: Run tofu plan
        run: |
          echo '# platform stack plan' > comment.md
          echo '```text' >> comment.md
          tofu plan -no-color -lock=false -out=tfplan >> comment.md
          echo '```' >> comment.md

      - name: Post plan to PR
        continue-on-error: true
        uses: .github/actions/comment-on-pr
        with:
          input-file: infrastructure/stacks/core/platform/comment.md

      - name: Convert plan to JSON
        run: tofu show -json -plan=tfplan > tfplan.json

      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@v12
        with:
          file: infrastructure/stacks/core/platform/tfplan.json
          config_file: infrastructure/stacks/core/platform/.checkov.yml
          output_format: github_failed_only
          output_file_path: infrastructure/stacks/core/platform/checkov.md

      - name: Post scan results to PR
        continue-on-error: true
        uses: .github/actions/comment-on-pr
        with:
          input-file: infrastructure/stacks/core/platform/checkov.md
