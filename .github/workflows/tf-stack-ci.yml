name: TF Stack CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - edited
      - synchronize
    paths:
      - .github/workflows/tf-stack-*
      - infrastructure/stacks/**

concurrency:
  group: tf-stack-ci/${{ github.head_ref }}
  cancel-in-progress: true

env:
  TOFU_VERSION: 1.12.0
  STACK_DIR: infrastructure/stacks

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack:
          - network
          - platform
      fail-fast: false
    defaults:
      run:
        working-directory: ${{ env.STACK_DIR }}/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Initialize stack offline
        run: tofu init -backend=false

      - name: Validate
        run: tofu validate

  fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.STACK_DIR }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Format check
        run: tofu fmt -recursive -check -diff

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.STACK_DIR }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Use latest version of tflint
      - name: Set up tflint
        uses: terraform-linters/setup-tflint@v6

      - name: Lint
        run: |
          tflint --init
          tflint -f compact

  plan-network:
    runs-on: ubuntu-latest
    needs:
      - validate
      - fmt
      - lint
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: ${{ env.STACK_DIR }}/network
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: "${{ vars.GCLOUD_PROJECT }}"
          workload_identity_provider: "${{ vars.GCLOUD_PROVIDER }}"
          service_account: "${{ vars.PLAN_SA }}"

      - name: Initialize stack online
        run: tofu init

      - name: Run tofu plan and detect changes
        run: |
          echo '# network stack plan' > comment.md
          echo '```text' >> comment.md
          tofu plan -no-color -lock=false -out=tfplan >> comment.md
          echo '```' >> comment.md

          tofu show -json -plan=tfplan > tfplan.json
          if jq -e 'any(.resource_changes[]?.change.actions[]?; . != "no-op")' tfplan.json >/dev/null; then
            echo "# WARNING" >> comment.md
            echo "Changes detected for network stack." >> comment.md
            echo "Be sure to deploy network stack manually before merging." >> comment.md
          fi

      - name: Post plan to PR
        continue-on-error: true
        uses: ./.github/actions/comment-on-pr
        with:
          input-file: ${{ env.STACK_DIR }}/network/comment.md

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          file: ${{ env.STACK_DIR }}/network/tfplan.json
          config_file: ${{ env.STACK_DIR }}/network/.checkov.yml
          output_format: github_failed_only
          output_file_path: ${{ env.STACK_DIR }}/network/scan

      - name: Post scan results to PR
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/comment-on-pr
        with:
          input-file: ${{ env.STACK_DIR }}/network/scan/results_github_failed_only.md # discovered with ls

  plan-platform:
    runs-on: ubuntu-latest
    needs:
      - plan-network
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: ${{ env.STACK_DIR }}/platform
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: "${{ vars.GCLOUD_PROJECT }}"
          workload_identity_provider: "${{ vars.GCLOUD_PROVIDER }}"
          service_account: "${{ vars.PLAN_SA }}"

      - name: Initialize stack online
        run: tofu init

      - name: Run tofu plan
        run: |
          echo '# platform stack plan' > comment.md
          echo '```text' >> comment.md
          tofu plan -no-color -lock=false -out=tfplan >> comment.md
          echo '```' >> comment.md

          tofu show -json -plan=tfplan > tfplan.json

      - name: Post plan to PR
        continue-on-error: true
        uses: ./.github/actions/comment-on-pr
        with:
          input-file: ${{ env.STACK_DIR }}/platform/comment.md

      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@v12
        with:
          file: ${{ env.STACK_DIR }}/platform/tfplan.json
          config_file: ${{ env.STACK_DIR }}/platform/.checkov.yml
          output_format: github_failed_only
          output_file_path: ${{ env.STACK_DIR }}/platform/scan

      - name: Post scan results to PR
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/comment-on-pr
        with:
          input-file: ${{ env.STACK_DIR }}/platform/scan/results_github_failed_only.md
