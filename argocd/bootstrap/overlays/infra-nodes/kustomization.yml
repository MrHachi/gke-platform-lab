apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: tolerations.yml
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=argocd

  - path: tolerations.yml
    target:
      kind: StatefulSet
      labelSelector: app.kubernetes.io/part-of=argocd

  - path: reconciliation.yml
    target:
      kind: ConfigMap
      name: argocd-cm
