controller:
  type: statefulset
  replicas: 1

  tolerations:
    - key: "components.gke.io/gke-managed-components"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  volumeClaimTemplates:
    - metadata:
        name: data-alloy
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi

alloy:
  storagePath: /var/lib/alloy
  mounts:
    extra:
      - name: data-alloy
        mountPath: /var/lib/alloy
