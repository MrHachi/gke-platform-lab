controller:
  type: statefulset
  replicas: 1

  tolerations:
    - key: "components.gke.io/gke-managed-components"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  configMap:
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.kubernetes "nodes" {
        role = "node"
      }

      discovery.kubernetes "services" {
        role = "service"
      }

      discovery.kubernetes "endpointslices" {
        role = "endpointslice"
      }

      discovery.kubernetes "ingresses" {
        role = "ingress"
      }

      loki.source.file "log_scrape" {
        targets    = array.concat(
            discovery.kubernetes.pods.targets,
            discovery.kubernetes.nodes.targets,
            discovery.kubernetes.services.targets,
            discovery.kubernetes.endpointslices.targets,
            discovery.kubernetes.ingresses.targets,
          )
        // forward_to = [loki.process.filter_logs.receiver]
        forward_to = [loki.write.grafana_loki.receiver]
        tail_from_end = true
      }

      // loki.process "filter_logs" {
      //   stage.drop {
      //     source = ""
      //     expression  = ".*Connection closed by authenticating user root"
      //     drop_counter_reason = "noisy"
      //   }
      //   forward_to = [loki.write.grafana_loki.receiver]
      // }

      loki.write "grafana_loki" {
        endpoint {
          url = "http://loki.observability.svc.cluster.local/loki/api/v1/push"

          // basic_auth {
          //  username = "admin"
          //  password = "admin"
          // }
        }
      }

  volumeClaimTemplates:
    - metadata:
        name: data-alloy
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi

alloy:
  storagePath: /var/lib/alloy
  mounts:
    extra:
      - name: data-alloy
        mountPath: /var/lib/alloy
