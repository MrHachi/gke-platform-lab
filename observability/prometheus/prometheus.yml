global:
  scrape_interval: 15s
  # To distinguish data ownership in the TSDB
  external_labels:
    cluster: gke-platform-lab
    replica: ${POD_NAME} # Environment variable expansion; see sts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node-exporter

    kubernetes_sd_configs:
      - role: pod
        attach_metadata:
          node: true

    relabel_configs:
      # Only keep node-exporter pods
      - source_labels:
          - __meta_kubernetes_pod_label_app_kubernetes_io_name
          - __meta_kubernetes_pod_label_app_kubernetes_io_component
        separator: "/"
        regex: prom/node-exporter
        action: keep

      # Only keep ready pods
      - source_labels:
          - __meta_kubernetes_pod_ready
        regex: "true"
        action: keep

      # Scrape the pod IP on port 9100
      - source_labels:
          - __meta_kubernetes_pod_ip
        target_label: __address__
        regex: (.+)
        replacement: "$1:9100"

      - source_labels:
          - __meta_kubernetes_pod_node_name
        target_label: node

      - source_labels:
          - __meta_kubernetes_pod_name
        target_label: pod

      - source_labels:
          - __meta_kubernetes_namespace
        target_label: namespace

      - source_labels:
          - __meta_kubernetes_node_label_workload
        target_label: workload
