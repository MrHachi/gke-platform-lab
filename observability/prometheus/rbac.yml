apiVersion: v1
kind: ServiceAccount
metadata:
  name: prom
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prom
rules:
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - services
      - endpoints
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prom
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prom
subjects:
  - kind: ServiceAccount
    name: prom
    namespace: observability
